<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="countdown.css">
    <script defer src="countdown.js"></script>
</head>
<body>

    <nav class="navbar">
        <ul>
            <li><a href="dashboard.html">💜 Dashboard</a></li>
            <li><a href="bucketlist.html">🎯 Bucket List</a></li>
            <li><a href="vault.html">📜 Letter Vault</a></li>
            <li><a href="story.html">💑 Our Story</a></li>
            <li><a class="active" href="countdown.html">⏳ Countdown</a></li>
        </ul>
    </nav>

    <div class="countdown-container">
        <h1>Countdown to your next Birthday 🎂</h1>
        <p class="subtitle">Time left until your special day:</p>
        
        <div class="countdown">
            <div class="time-box"><span id="days">00</span> Days</div>
            <div class="time-box"><span id="hours">00</span> Hours</div>
            <div class="time-box"><span id="minutes">00</span> Minutes</div>
            <div class="time-box"><span id="seconds">00</span> Seconds</div>
        </div>
    </div>

</body>
</html>
